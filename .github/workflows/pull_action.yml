name: Pull and Save Docker Images
on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'arm64v8/ros:jazzy'
      platform:
        description: '镜像平台 (linux/arm64=ARM, linux/amd64=x86)，留空则自动'
        required: false
        default: ''

jobs:
  pull_and_package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean up Docker to free space
      run: |
          docker system prune -a -f
          docker volume prune -f

    - name: Pull Docker Images and Package
      run: |
        images="${{ github.event.inputs.docker_images }}"
        platform="${{ github.event.inputs.platform }}"
        IFS=',' read -r -a image_array <<< "$images"
        for image in "${image_array[@]}"; do
          # 显式指定平台拉取，避免 runner(amd64) 拉取 arm64 镜像时报
          # "no matching manifest for linux/amd64"
          if [ -n "$platform" ]; then
            docker pull --platform "${platform}" "${image}"
          else
            docker pull "${image}" || docker pull --platform linux/arm64 "${image}"
          fi
          docker save "${image}" -o "${image//\//_}-images.tar"
        done

    - name: Compress the TAR files
      run: tar -czf docker_images.tar.gz *-images.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-images-tar
        path: docker_images.tar.gz
        retention-days: 1  # 将保留天数设置为 1 天 最多可设置90天

    - name: Clean up intermediate files
      run: |
        rm *-images.tar
